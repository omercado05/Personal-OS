# Personal OS — entorno local.
#
# 6 servicios: frontend · backend · mysql · postgres · clickhouse · hexclave-server
#
#   Dev (rápido):        docker compose up -d mysql postgres clickhouse hexclave-server
#                        + `pnpm dev` en backend/ y frontend/ (hot-reload)
#   Integración (prod):  docker compose up --build
#
# Host público (navegador): todas las URLs externas (frontend, backend, Hexclave)
# se DERIVAN de `PUBLIC_HOST` + `PUBLIC_SCHEME` (ver .env). Para exponer la app
# fuera de casa basta con cambiar `PUBLIC_HOST` (p. ej. a la IP/nombre de
# Tailscale) y reconstruir el frontend, que incrusta las `NEXT_PUBLIC_*` en el
# bundle en tiempo de build.
#
# PostgreSQL y ClickHouse NO se publican al host (solo red interna).
# MySQL SÍ se publica, pero solo en 127.0.0.1, para poder ejecutar `pnpm dev` y
# las migraciones de Prisma (`pnpm db:migrate`) desde el host. En el contenedor
# `backend` se usa siempre el hostname interno `mysql`.

name: personal-os

services:
  # --- Base de datos de la aplicación ---------------------------------------
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306" # solo localhost, para dev/migraciones desde el host
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --- Base de datos de Hexclave --------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # --- Analytics de Hexclave ------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:25.10
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --- Hexclave (Stack Auth) self-hosted: dashboard (8101) + API (8102) ------
  hexclave-server:
    # Fijada por digest (no por `latest`) para que un `docker compose pull` no
    # introduzca cambios de esquema silenciosos (R8). Actualizar es deliberado:
    #   docker pull stackauth/server:latest && docker inspect --format '{{index .RepoDigests 0}}' stackauth/server:latest
    image: stackauth/server@sha256:086450b0637e0ede27229ef492ff4a95e7db23b8d00ba730d468e995b07bdc1f
    restart: unless-stopped
    # El seed oficial de Stack Auth no es idempotente para proyectos de
    # "development environment" y tumba el contenedor al reiniciar. El wrapper
    # omite el seed cuando el proyecto ya existe (ver docker/hexclave/entrypoint.sh).
    entrypoint: ["/bin/sh", "/opt/hexclave/entrypoint.sh"]
    volumes:
      - ./docker/hexclave/entrypoint.sh:/opt/hexclave/entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_STACK_API_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:8102"
      NEXT_PUBLIC_STACK_DASHBOARD_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:8101"
      HEXCLAVE_TRUSTED_PROXY: ${HEXCLAVE_TRUSTED_PROXY:-}
      STACK_DATABASE_CONNECTION_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STACK_SERVER_SECRET: ${STACK_SERVER_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      STACK_CLICKHOUSE_URL: http://clickhouse:8123
      STACK_CLICKHOUSE_DATABASE: ${CLICKHOUSE_DB}
      STACK_CLICKHOUSE_ADMIN_USER: ${CLICKHOUSE_USER}
      STACK_CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_PASSWORD}
      STACK_CLICKHOUSE_EXTERNAL_PASSWORD: ${STACK_CLICKHOUSE_EXTERNAL_PASSWORD}
      STACK_INTERNAL_PROJECT_PUBLISHABLE_CLIENT_KEY: ${STACK_INTERNAL_PROJECT_PUBLISHABLE_CLIENT_KEY}
      STACK_INTERNAL_PROJECT_SECRET_SERVER_KEY: ${STACK_INTERNAL_PROJECT_SECRET_SERVER_KEY}
      STACK_SEED_INTERNAL_PROJECT_SUPER_SECRET_ADMIN_KEY: ${STACK_SEED_INTERNAL_PROJECT_SUPER_SECRET_ADMIN_KEY}
      STACK_SEED_INTERNAL_PROJECT_USER_EMAIL: ${STACK_SEED_INTERNAL_PROJECT_USER_EMAIL}
      STACK_SEED_INTERNAL_PROJECT_USER_PASSWORD: ${STACK_SEED_INTERNAL_PROJECT_USER_PASSWORD}
      STACK_SEED_INTERNAL_PROJECT_USER_INTERNAL_ACCESS: ${STACK_SEED_INTERNAL_PROJECT_USER_INTERNAL_ACCESS}
      STACK_SEED_INTERNAL_PROJECT_SIGN_UP_ENABLED: ${STACK_SEED_INTERNAL_PROJECT_SIGN_UP_ENABLED}
    ports:
      - "8101:8101" # dashboard
      - "8102:8102" # API
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8102/health?db=1').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 300s

  # --- API (Fastify) --------------------------------------------------------
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      hexclave-server:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: "0.1.0"
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      HEXCLAVE_API_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:8102"
      # Server-to-server dentro de la red de Docker: no depende del host público.
      HEXCLAVE_INTERNAL_API_URL: http://hexclave-server:8102
      HEXCLAVE_PROJECT_ID: ${HEXCLAVE_PROJECT_ID:-}
      HEXCLAVE_PUBLISHABLE_CLIENT_KEY: ${HEXCLAVE_PUBLISHABLE_CLIENT_KEY:-}
      HEXCLAVE_SECRET_SERVER_KEY: ${HEXCLAVE_SECRET_SERVER_KEY:-}
      # `iss` se deriva de HEXCLAVE_API_URL + project ID (deja HEXCLAVE_ISSUER
      # vacío salvo que necesites sobreescribirlo; ver DEVELOPMENT_PLAN.md §8.3).
      # El JWKS NO se fija aquí: el backend lo deriva de la URL interna.
      HEXCLAVE_ISSUER: ${HEXCLAVE_ISSUER:-}
      HEXCLAVE_AUDIENCE: ${HEXCLAVE_AUDIENCE:-}
      # Se aceptan AMBOS orígenes: el local (localhost) y el público (Tailscale).
      # Así la app funciona igual si la abres desde el propio equipo o desde
      # fuera, sin tocar la configuración.
      CORS_ORIGIN: "http://localhost:3000,${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:3000"
    ports:
      - "4000:4000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:4000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # --- Web (Next.js) --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:4000"
        NEXT_PUBLIC_HEXCLAVE_API_URL: "${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:8102"
        NEXT_PUBLIC_HEXCLAVE_PROJECT_ID: ${HEXCLAVE_PROJECT_ID:-}
        NEXT_PUBLIC_HEXCLAVE_PUBLISHABLE_CLIENT_KEY: ${HEXCLAVE_PUBLISHABLE_CLIENT_KEY:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  mysql-data:
  postgres-data:
  clickhouse-data:

networks:
  default:
    name: personal-os
